<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint into the notch/home-indicator area;
      the layout adds safe-area padding back where it matters.
      maximum-scale is deliberately NOT set to 1: pinch-zoom on results matters
      more than avoiding an occasional focus zoom, and inputs use 16px text so
      iOS does not zoom on focus anyway.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Latent" />
    <meta name="description" content="A mobile-optimised frontend for ComfyUI" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Latent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
